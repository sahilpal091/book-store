<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body class="main">

    <div class="form-box registration">

        <h2>Registration</h2>

        <form>

            <table>

                <tr>
                    <td>Full Name:</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Email:</td>
                    <td><input type="email"></td>
                </tr>

                <tr>
                    <td>Phone:</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Sex:</td>
                    <td>
                        <label class="sex"><input type="radio" name="sex" value="Male"> Male</label>
                        <label class="sex"><input type="radio" name="sex" value="Female"> Female</label>
                    </td>
                </tr>

                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date"></td>
                </tr>

                <tr>
                    <td>Languages Known:</td>
                    <td>
                        <input type="checkbox" id="eng" name="lang" value="English">
                        <label for="eng">English</label>
                        <br>
                        <input type="checkbox" id="hin" name="lang" value="Hindi">
                        <label for="hin">Hindi</label>
                        <br>
                        <input type="checkbox" id="tel" name="lang" value="Telugu">
                        <label for="tel">Telugu</label>
                        <br>
                        <input type="checkbox" id="tam" name="lang" value="Tamil">
                        <label for="tam">Tamil</label>
                    </td>
                </tr>

                <tr>
                    <td>User Name:</td>
                    <td><input type="text"></td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td><input type="password"></td>
                </tr>

                <tr>
                    <td>Confirm Password:</td>
                    <td><input type="password"></td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Register">
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>

        </form>

    </div>

</body>
</html>
