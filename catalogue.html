<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body class="main">

    <h2 class="page-title">Book Catalogue</h2>

    <div class="books">

        <div class="book">
            <img src="c.jpg" alt="Programming in C">
            <h4>Programming in C</h4>
            <p class="meta">E. Balagurusamy<br>McGraw Hill</p>
            <p class="price">₹450</p>
            <button>Add to Cart</button>
        </div>

        <div class="book">
            <img src="ds.jpg" alt="Data Structures">
            <h4>Data Structures</h4>
            <p class="meta">Reema Thareja<br>Oxford</p>
            <p class="price">₹550</p>
            <button>Add to Cart</button>
        </div>

        <div class="book">
            <img src="java.jpg" alt="Java Programming">
            <h4>Java Programming</h4>
            <p class="meta">Herbert Schildt<br>McGraw Hill</p>
            <p class="price">₹520</p>
            <button>Add to Cart</button>
        </div>

        <div class="book">
            <img src="ai.jpg" alt="Artificial Intelligence">
            <h4>Artificial Intelligence</h4>
            <p class="meta">S. Russell<br>Pearson</p>
            <p class="price">₹630</p>
            <button>Add to Cart</button>
        </div>

        <div class="book">
            <img src="html.jpg" alt="HTML, CSS, JavaScript">
            <h4>HTML, CSS, JavaScript</h4>
            <p class="meta">Jennifer Kymin<br>Pearson</p>
            <p class="price">₹820</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
